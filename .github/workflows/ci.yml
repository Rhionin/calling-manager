name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# One in-flight run per ref. Pushes to main queue, so production deploys cannot overlap.
concurrency:
  group: calling-manager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Wrangler
        run: npm ci

      - name: Parse callings
        run: node test/parse-callings.test.js

      - name: Pipeline
        run: node test/pipeline.test.js

      - name: Crypto file
        run: node test/crypto-file.test.js

      - name: Validate Wrangler config
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy
    needs: test
    # Push to this repository's main branch only. pull_request (including forks)
    # never reaches this job, and this job is the only one that reads secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Rhionin/calling-manager'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: calling-manager-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          command: deploy
